<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Clash 3D – Swarm Mode (Three.js)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; }
    canvas { display: block; }
    .hud {
      position: fixed; left: 12px; top: 10px;
      color: #cbd5e1; font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      opacity: 0.92; user-select: none; line-height: 1.35;
    }
    .hud b { color: #e2e8f0; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    Move mouse • 500 swarm snakes • Eat dots • Eat each other • Middle-hit cuts into half-snake + dots<br/>
    <span id="stats"></span>
  </div>

<script type="module">
import * as THREE from "three";

/* -----------------------------
   CONFIG
----------------------------- */
const WORLD_SIZE = 90;

// Food
const FOOD_COUNT = 900;

// Swarm (small snakes)
const SWARM_COUNT = 500;                 // << your “50x more” starts here
const SWARM_BASE_SPEED = 7.2;
const SWARM_MIN_LEN = 1;
const SWARM_MAX_LEN = 260;               // logical length for swarm snakes
const SWARM_EAT_RANGE2 = 0.85 * 0.85;

// Promote big snakes (rendered as segments)
const PROMOTE_LEN = 30;                  // when swarm gets >= this, it becomes a big segmented snake
const BIG_MAX = 35;                      // cap number of big snakes (performance)
const BIG_MAX_LEN = 520;                 // segment cap
const SEG_SPACING = 0.65;
const SEG_RADIUS  = 0.33;

// Combat / cut behavior
const MIDDLE_MARGIN = 8;                 // middle definition for big snakes
const CUT_MIN_KEEP = 2;                  // KEEP even tiny half-snakes (fixes “disappearing”)
const DOT_DROP_CUT_FACTOR = 0.75;
const DOT_DROP_EAT_FACTOR = 0.55;

// Speed ramp (slight, but visible)
const RAMP_MAX = 0.18;
const RAMP_SECS = 140;

// If you want it even more chaotic, raise these:
const EXTRA_SPAWNS_PER_MIN = 0;          // keep 0 for now; swarm already huge

/* -----------------------------
   THREE SETUP
----------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0f14, 50, 260);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 600);
camera.position.set(0, 20, 24);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const sun = new THREE.DirectionalLight(0xffffff, 0.95);
sun.position.set(22, 40, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -120;
sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120;
sun.shadow.camera.bottom = -120;
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far = 200;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_SIZE * 2.2, WORLD_SIZE * 2.2),
  new THREE.MeshStandardMaterial({ color: 0x0d1726, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Border ring
const border = new THREE.Mesh(
  new THREE.RingGeometry(WORLD_SIZE * 1.01, WORLD_SIZE * 1.02, 128),
  new THREE.MeshBasicMaterial({ color: 0x1c2a3a, transparent: true, opacity: 0.6 })
);
border.rotation.x = -Math.PI / 2;
scene.add(border);

/* -----------------------------
   MOUSE -> WORLD POINT (y=0)
----------------------------- */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2(0, 0);
const planeY0 = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const mouseWorld = new THREE.Vector3(0, 0, 0);

window.addEventListener("mousemove", (e) => {
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

function updateMouseWorld() {
  raycaster.setFromCamera(mouseNDC, camera);
  raycaster.ray.intersectPlane(planeY0, mouseWorld);
}

/* -----------------------------
   HELPERS
----------------------------- */
const statsEl = document.getElementById("stats");
const tmpMat4 = new THREE.Matrix4();
const tmpPos = new THREE.Vector3();
const tmpQuat = new THREE.Quaternion();
const tmpScale = new THREE.Vector3();

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

function inBoundsXZ(v) {
  v.x = clamp(v.x, -WORLD_SIZE, WORLD_SIZE);
  v.z = clamp(v.z, -WORLD_SIZE, WORLD_SIZE);
  v.y = 0;
  return v;
}

function dist2XZ(a, b) {
  const dx = a.x - b.x;
  const dz = a.z - b.z;
  return dx*dx + dz*dz;
}

function globalSpeedMult(elapsedSec) {
  return 1 + Math.min(RAMP_MAX, (elapsedSec / RAMP_SECS) * RAMP_MAX);
}

/* -----------------------------
   FOOD (Instanced)
----------------------------- */
const foodGeo = new THREE.SphereGeometry(0.18, 12, 10);
const foodMat = new THREE.MeshStandardMaterial({
  color: 0x36d83a, roughness: 0.45, metalness: 0.05,
  emissive: 0x0b2a0c, emissiveIntensity: 0.7
});
const foodMesh = new THREE.InstancedMesh(foodGeo, foodMat, FOOD_COUNT);
scene.add(foodMesh);

const foodPos = Array.from({ length: FOOD_COUNT }, () => new THREE.Vector3());

function respawnFood(i, near=null) {
  if (near) {
    foodPos[i].set(
      clamp(near.x + rand(-2.7, 2.7), -WORLD_SIZE, WORLD_SIZE),
      0.18,
      clamp(near.z + rand(-2.7, 2.7), -WORLD_SIZE, WORLD_SIZE)
    );
  } else {
    foodPos[i].set(rand(-WORLD_SIZE, WORLD_SIZE), 0.18, rand(-WORLD_SIZE, WORLD_SIZE));
  }
}

for (let i = 0; i < FOOD_COUNT; i++) respawnFood(i);

function syncFood() {
  for (let i = 0; i < FOOD_COUNT; i++) {
    const p = foodPos[i];
    tmpMat4.makeTranslation(p.x, p.y, p.z);
    foodMesh.setMatrixAt(i, tmpMat4);
  }
  foodMesh.instanceMatrix.needsUpdate = true;
}
syncFood();

function dropDotsFromPositions(positions, factor) {
  if (!positions || positions.length === 0) return;
  const n = clamp(Math.floor(positions.length * factor), 6, 220);
  for (let k = 0; k < n; k++) {
    const fi = randInt(0, FOOD_COUNT - 1);
    const p = positions[randInt(0, positions.length - 1)];
    respawnFood(fi, p);
  }
}

/* -----------------------------
   SWARM SNAKES (single instanced sphere each)
   - fast for 500+
----------------------------- */
const swarmGeo = new THREE.SphereGeometry(0.25, 10, 9);
const swarmMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.55, metalness: 0.06 });
const swarmMesh = new THREE.InstancedMesh(swarmGeo, swarmMat, SWARM_COUNT);
swarmMesh.castShadow = true;
scene.add(swarmMesh);

const swarm = Array.from({ length: SWARM_COUNT }, () => ({
  alive: true,
  pos: new THREE.Vector3(rand(-WORLD_SIZE, WORLD_SIZE), 0, rand(-WORLD_SIZE, WORLD_SIZE)),
  vel: new THREE.Vector3(0, 0, 0),
  len: randInt(1, 6),
  wander: rand(0, Math.PI*2),
  hue: Math.random()
}));

function syncSwarm() {
  for (let i = 0; i < SWARM_COUNT; i++) {
    const s = swarm[i];
    if (!s.alive) {
      tmpMat4.compose(new THREE.Vector3(0, -9999, 0), tmpQuat, new THREE.Vector3(0.001,0.001,0.001));
      swarmMesh.setMatrixAt(i, tmpMat4);
      continue;
    }
    // size grows a bit with length
    const r = 0.20 + Math.min(0.22, s.len * 0.0045);
    tmpPos.set(s.pos.x, r, s.pos.z);
    tmpScale.set(r/0.25, r/0.25, r/0.25);
    tmpMat4.compose(tmpPos, tmpQuat, tmpScale);
    swarmMesh.setMatrixAt(i, tmpMat4);
  }
  swarmMesh.instanceMatrix.needsUpdate = true;
}

/* -----------------------------
   BIG SNAKES (segmented instanced mesh per snake)
   - limited count for performance
----------------------------- */
const segGeo = new THREE.SphereGeometry(SEG_RADIUS, 14, 12);

class BigSnake {
  constructor({ isPlayer, colorHex, baseSpeed, startPos, startLen }) {
    this.isPlayer = isPlayer;
    this.baseSpeed = baseSpeed;
    this.colorHex = colorHex;
    this.alive = true;

    this.head = startPos.clone();
    this.vel = new THREE.Vector3(0,0,0);
    this.segments = [];
    const L = clamp(startLen, 1, BIG_MAX_LEN);

    for (let i=0;i<L;i++) {
      this.segments.push(startPos.clone().add(new THREE.Vector3(0,0,i*SEG_SPACING)));
    }

    this.wander = rand(0, Math.PI*2);
    this.aiTarget = startPos.clone();
    this.aiTimer = 0;

    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(colorHex),
      roughness: 0.38,
      metalness: 0.08
    });
    this.mesh = new THREE.InstancedMesh(segGeo, mat, BIG_MAX_LEN);
    this.mesh.castShadow = true;
    scene.add(this.mesh);
    this.sync(true);
  }

  length(){ return this.segments.length; }

  currentSpeed(elapsed){
    return this.baseSpeed * globalSpeedMult(elapsed);
  }

  grow(n){
    const add = Math.max(0, Math.floor(n));
    for (let k=0;k<add;k++){
      if (this.segments.length >= BIG_MAX_LEN) break;
      this.segments.push(this.segments[this.segments.length-1].clone());
    }
  }

  update(dt, elapsed){
    if (!this.alive) return;

    const spd = this.currentSpeed(elapsed);
    let dir = new THREE.Vector3(0,0,0);

    if (this.isPlayer) {
      updateMouseWorld();
      dir.copy(mouseWorld).sub(this.head);
      dir.y = 0;
      if (dir.lengthSq() > 1e-6) dir.normalize();
    } else {
      this.aiTimer -= dt;
      if (this.aiTimer <= 0){
        this.aiTimer = rand(0.5, 1.1);
        this.wander += rand(-0.9, 0.9);

        // chase random food sample (fast)
        let best = null, bestD = Infinity;
        for (let s=0;s<22;s++){
          const idx = randInt(0, FOOD_COUNT-1);
          const p = foodPos[idx];
          const d = dist2XZ(this.head, p);
          if (d < bestD){ bestD = d; best = p; }
        }
        if (best) this.aiTarget.copy(best);
      }

      const wdir = new THREE.Vector3(Math.cos(this.wander), 0, Math.sin(this.wander)).normalize();
      const tdir = this.aiTarget.clone().sub(this.head); tdir.y = 0;
      if (tdir.lengthSq() > 1e-6) tdir.normalize();

      dir.copy(tdir).multiplyScalar(0.72).add(wdir.multiplyScalar(0.28));
      if (dir.lengthSq() > 1e-6) dir.normalize();
    }

    // smooth velocity
    const targetVel = dir.multiplyScalar(spd);
    this.vel.lerp(targetVel, 0.14);
    this.head.addScaledVector(this.vel, dt);
    inBoundsXZ(this.head);

    // follow
    this.segments[0].copy(this.head);
    for (let i=1;i<this.segments.length;i++){
      const prev = this.segments[i-1];
      const cur  = this.segments[i];

      tmpPos.copy(cur).sub(prev); tmpPos.y = 0;
      const d = tmpPos.length();
      if (d < 1e-6) continue;
      const pull = (d - SEG_SPACING) / d;
      cur.addScaledVector(tmpPos, -pull);
      cur.y = 0;
    }

    this.sync(false);
  }

  sync(force){
    const L = this.segments.length;
    for (let i=0;i<L;i++){
      const p = this.segments[i];
      const t = i / Math.max(1, L-1);
      const s = 1.0 - t*0.18;

      tmpPos.set(p.x, SEG_RADIUS, p.z);
      tmpScale.set(s,s,s);
      tmpMat4.compose(tmpPos, tmpQuat, tmpScale);
      this.mesh.setMatrixAt(i, tmpMat4);
    }
    for (let i=L;i<BIG_MAX_LEN;i++){
      tmpMat4.compose(new THREE.Vector3(0,-9999,0), tmpQuat, new THREE.Vector3(0.001,0.001,0.001));
      this.mesh.setMatrixAt(i, tmpMat4);
    }
    this.mesh.instanceMatrix.needsUpdate = true;
    if (force) this.mesh.computeBoundingSphere();
  }

  destroy(){
    this.alive = false;
    scene.remove(this.mesh);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
  }
}

/* -----------------------------
   PLAYER (Big snake, starts as dot)
----------------------------- */
let elapsed = 0;
let dead = false;

const bigSnakes = [];
const player = new BigSnake({
  isPlayer: true,
  colorHex: 0x22d3ee,
  baseSpeed: 8.0,
  startPos: new THREE.Vector3(0,0,0),
  startLen: 1
});
bigSnakes.push(player);

/* -----------------------------
   Promote swarm snakes into big snakes
----------------------------- */
function promoteSwarmIndex(i){
  const s = swarm[i];
  if (!s.alive) return false;
  if (bigSnakes.filter(x=>x.alive && !x.isPlayer).length >= BIG_MAX) return false;

  const color = new THREE.Color().setHSL(s.hue, 0.78, 0.55).getHex();
  const bs = new BigSnake({
    isPlayer: false,
    colorHex: color,
    baseSpeed: 7.4 * (1 + Math.min(0.10, (s.len-30)*0.0015)),
    startPos: s.pos.clone(),
    startLen: Math.min(BIG_MAX_LEN, Math.max(10, s.len))
  });
  bigSnakes.push(bs);

  // remove swarm snake
  s.alive = false;
  s.len = 0;
  return true;
}

/* -----------------------------
   EAT FOOD
----------------------------- */
function eatFoodBig(b){
  // head-only
  for (let i=0;i<FOOD_COUNT;i++){
    if (dist2XZ(b.head, foodPos[i]) < (0.78*0.78)){
      respawnFood(i);
      b.grow(b.isPlayer ? 2 : 1);
    }
  }
}

function eatFoodSwarm(s){
  // head-only; swarm len grows slowly
  for (let i=0;i<FOOD_COUNT;i++){
    if (dist2XZ(s.pos, foodPos[i]) < SWARM_EAT_RANGE2){
      respawnFood(i);
      s.len = clamp(s.len + 1, SWARM_MIN_LEN, SWARM_MAX_LEN);
    }
  }
}

/* -----------------------------
   SWARM MOVEMENT
----------------------------- */
function updateSwarm(dt){
  const mult = globalSpeedMult(elapsed);

  // simple behavior: wander + chase a random food sample
  for (let i=0;i<SWARM_COUNT;i++){
    const s = swarm[i];
    if (!s.alive) continue;

    s.wander += rand(-1.1, 1.1) * dt;

    // food sample chase (cheap)
    let best = null, bestD = Infinity;
    for (let k=0;k<10;k++){
      const fi = randInt(0, FOOD_COUNT-1);
      const p = foodPos[fi];
      const d = dist2XZ(s.pos, p);
      if (d < bestD){ bestD = d; best = p; }
    }

    const wdir = new THREE.Vector3(Math.cos(s.wander), 0, Math.sin(s.wander)).normalize();
    const tdir = best ? best.clone().sub(s.pos) : new THREE.Vector3(0,0,0);
    tdir.y = 0;
    if (tdir.lengthSq() > 1e-6) tdir.normalize();

    const dir = tdir.multiplyScalar(0.70).add(wdir.multiplyScalar(0.30));
    if (dir.lengthSq() > 1e-6) dir.normalize();

    const spd = SWARM_BASE_SPEED * mult * (1 - Math.min(0.22, Math.max(0, s.len-120)*0.0018));
    const targetVel = dir.multiplyScalar(spd);
    s.vel.lerp(targetVel, 0.14);

    s.pos.addScaledVector(s.vel, dt);
    inBoundsXZ(s.pos);
  }
}

/* -----------------------------
   SWARM vs SWARM COMBAT (parallel)
   Rule: if your head touches someone and they are longer, you die; else you eat them (gain full length).
----------------------------- */
function resolveSwarmCombat(){
  // To keep it fast with 500 snakes, we do a random pairing sample per frame.
  // This still creates LOTS of eating over time.
  const checks = 1400; // increase for more chaos, but too high hurts fps

  for (let c=0;c<checks;c++){
    const a = randInt(0, SWARM_COUNT-1);
    const b = randInt(0, SWARM_COUNT-1);
    if (a === b) continue;

    const sa = swarm[a], sb = swarm[b];
    if (!sa.alive || !sb.alive) continue;

    // collision radius grows with len
    const ra = 0.30 + Math.min(0.40, sa.len * 0.004);
    const rb = 0.30 + Math.min(0.40, sb.len * 0.004);
    const r2 = (ra + rb) * (ra + rb);

    if (dist2XZ(sa.pos, sb.pos) > r2) continue;

    if (sb.len > sa.len){
      // a dies
      sa.alive = false;
      // drop dots from its “body” (simulate)
      dropDotsFromPositions([sa.pos], 0.9);
    } else {
      // a eats b
      sa.len = clamp(sa.len + sb.len, SWARM_MIN_LEN, SWARM_MAX_LEN);
      sb.alive = false;
      dropDotsFromPositions([sb.pos], 0.9);
    }
  }
}

/* -----------------------------
   BIG SNAKE COMBAT (parallel) – FIXES “DISAPPEAR”
   - prevents double-processing in same frame
   - mid-cut ALWAYS keeps a half snake (even tiny)
   - eating adds FULL length
----------------------------- */
function gameOver(){
  if (dead) return;
  dead = true;
  setTimeout(()=>{ alert("Game Over!"); location.reload(); }, 60);
}

function dropDotsFromBigSegments(segments, factor){
  dropDotsFromPositions(segments, factor);
}

function eatOrCutBig(attacker, target, hitIndex){
  const targetLenBefore = target.length();

  if (targetLenBefore > attacker.length()){
    if (attacker === player) gameOver();
    else attacker.destroy();
    return;
  }

  const isMiddle = hitIndex >= MIDDLE_MARGIN && hitIndex <= (targetLenBefore - 1 - MIDDLE_MARGIN);

  if (isMiddle){
    // Keep head half as snake, tail half becomes dots
    const headHalf = target.segments.slice(0, hitIndex);
    const tailHalf = target.segments.slice(hitIndex + 1);

    dropDotsFromBigSegments(tailHalf, DOT_DROP_CUT_FACTOR);

    // KEEP even tiny half-snakes (fix #2)
    if (headHalf.length < CUT_MIN_KEEP){
      // if absurdly tiny, just keep 1-2 segments
      const kept = target.segments.slice(0, CUT_MIN_KEEP);
      target.segments = kept.map(v=>v.clone());
    } else {
      target.segments = headHalf.map(v=>v.clone());
    }

    target.head.copy(target.segments[0]);
    target.sync(true);

    // attacker gains the CUT OFF portion length (feels fair)
    const gained = Math.max(1, targetLenBefore - hitIndex);
    attacker.grow(gained);

  } else {
    // Fully eaten: attacker gains FULL length (fix #3)
    const gained = targetLenBefore;
    dropDotsFromBigSegments(target.segments, DOT_DROP_EAT_FACTOR);

    if (target === player) gameOver();
    else target.destroy();

    attacker.grow(gained);
  }
}

function resolveBigCombat(){
  const live = bigSnakes.filter(s=>s.alive);
  const processed = new Set(); // targets acted on this frame (prevents vanish/double hits)

  for (let a=0;a<live.length;a++){
    const attacker = live[a];
    if (!attacker.alive) continue;

    for (let t=0;t<live.length;t++){
      if (a===t) continue;
      const target = live[t];
      if (!target.alive) continue;
      if (processed.has(target)) continue;

      // quick reject
      if (dist2XZ(attacker.head, target.head) > (18*18)) continue;

      // check attacker head vs target body
      let hitIndex = -1;
      const step = target.length() > 180 ? 2 : 1;
      for (let i=1;i<target.length();i+=step){
        if (dist2XZ(attacker.head, target.segments[i]) < (0.85*0.85)){
          hitIndex = i;
          break;
        }
      }
      if (hitIndex === -1) continue;

      processed.add(target);
      eatOrCutBig(attacker, target, hitIndex);
      break; // attacker only resolves one target per frame (stability)
    }
  }
}

/* -----------------------------
   Swarm interacts with big snakes (jeopardy)
   - swarm can nibble big snakes if huge, big snakes can eat swarm
----------------------------- */
function resolveSwarmBigCombat(){
  // sample a bunch
  const samples = 1100;
  const bigLive = bigSnakes.filter(s=>s.alive);

  for (let k=0;k<samples;k++){
    const si = randInt(0, SWARM_COUNT-1);
    const s = swarm[si];
    if (!s.alive) continue;

    const b = bigLive[randInt(0, bigLive.length-1)];
    if (!b || !b.alive) continue;

    // if near big snake head/body area
    if (dist2XZ(s.pos, b.head) > (12*12)) continue;

    // approximate big snake body by sampling some segments
    const step = b.length() > 140 ? 3 : 2;
    let nearIdx = -1;
    for (let i=1;i<b.length();i+=step){
      if (dist2XZ(s.pos, b.segments[i]) < (0.7*0.7)){
        nearIdx = i; break;
      }
    }
    if (nearIdx === -1) continue;

    if (b.length() > s.len){
      // swarm dies (big eats it)
      b.grow(s.len); // full length transfer feel
      s.alive = false;
      dropDotsFromPositions([s.pos], 0.8);
    } else {
      // swarm is huge and can “bite” big snake: cut off some tail as dots
      const cutLen = Math.min(8, Math.max(2, Math.floor(s.len * 0.05)));
      const newLen = Math.max(CUT_MIN_KEEP, b.length() - cutLen);
      const tail = b.segments.slice(newLen);
      dropDotsFromBigSegments(tail, 0.9);
      b.segments = b.segments.slice(0, newLen);
      b.sync(true);

      s.len = clamp(s.len + cutLen, SWARM_MIN_LEN, SWARM_MAX_LEN);
    }
  }
}

/* -----------------------------
   CAMERA
----------------------------- */
function updateCamera(dt){
  const target = player.head;
  const desiredPos = new THREE.Vector3(target.x, 20, target.z + 24);
  camera.position.lerp(desiredPos, 1 - Math.pow(0.0002, dt));
  camera.lookAt(target.x, 0, target.z);
}

/* -----------------------------
   MAIN LOOP
----------------------------- */
let last = performance.now();

function tick(now){
  const dt = Math.min(0.033, (now - last)/1000);
  last = now;
  elapsed += dt;

  if (!dead){
    // Promote swarm into big snakes
    // Promote a few per second to avoid spikes
    for (let tries=0; tries<4; tries++){
      const i = randInt(0, SWARM_COUNT-1);
      if (swarm[i].alive && swarm[i].len >= PROMOTE_LEN){
        promoteSwarmIndex(i);
      }
    }

    // Update big snakes + eat
    for (const s of bigSnakes){
      if (s.alive) {
        s.update(dt, elapsed);
        eatFoodBig(s);
      }
    }

    // Update swarm + eat
    updateSwarm(dt);
    for (let i=0;i<SWARM_COUNT;i++){
      const s = swarm[i];
      if (!s.alive) continue;
      eatFoodSwarm(s);
    }

    // Combat (parallel)
    resolveSwarmCombat();
    resolveBigCombat();
    resolveSwarmBigCombat();

    // Visual sync
    syncFood();
    syncSwarm();

    // HUD
    updateCamera(dt);
    const rampPct = Math.round((globalSpeedMult(elapsed)-1)*100);
    const swarmLive = swarm.filter(s=>s.alive).length;
    const bigLive = bigSnakes.filter(s=>s.alive && !s.isPlayer).length;

    statsEl.innerHTML =
      `<b>Player Len:</b> ${player.length()} &nbsp; <b>Ramp:</b> +${rampPct}% &nbsp; ` +
      `<b>Swarm Alive:</b> ${swarmLive}/${SWARM_COUNT} &nbsp; <b>Big Snakes:</b> ${bigLive}/${BIG_MAX}`;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* -----------------------------
   RESIZE
----------------------------- */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
