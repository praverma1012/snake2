<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Clash 3D (Three.js) – Jeopardy Update</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; }
    canvas { display: block; }
    .hud {
      position: fixed; left: 12px; top: 10px;
      color: #cbd5e1; font: 14px system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      opacity: 0.92; user-select: none; line-height: 1.35;
    }
    .hud b { color: #e2e8f0; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="hud">
    Move mouse • Eat dots to grow • Bigger body kills • Mid-hit cuts into half-snake + dots • AI fights AI<br/>
    <span id="stats"></span>
  </div>

<script type="module">
import * as THREE from "three";

/* -----------------------------
   Config
----------------------------- */
const WORLD_SIZE = 80;

const FOOD_COUNT = 380;                 // more food = faster ecosystem growth
const AI_BASE    = 10;                  // more snakes to start
const AI_MAX     = 22;                  // cap for performance/chaos
const AI_GROWTH_PER_MIN = 3;            // +3 AI per minute until AI_MAX

const MAX_LEN = 420;
const SEG_SPACING = 0.65;
const SEG_RADIUS  = 0.33;

const HEAD_BODY_R2 = (0.85 * 0.85);     // collision threshold squared (tune feel)
const MIDDLE_MARGIN = 10;               // how strict “middle” is

const BASE_SPEED_PLAYER = 8.0;
const BASE_SPEED_AI     = 7.2;

// Speed ramp: make it visible but still “slight”
const RAMP_MAX = 0.18;                  // +18% cap
const RAMP_SECS = 150;                  // reach cap in ~2.5 minutes

// Jeopardy: occasional “hunters”
const HUNTER_CHANCE = 0.28;             // % of new spawns that are stronger
const HUNTER_SPEED_BOOST = 1.10;        // +10% base speed
const HUNTER_MIN_LEN = 16;
const HUNTER_MAX_LEN = 40;

// How many dots to drop from a eaten/cut snake body
const DOT_DROP_EAT_FACTOR = 0.55;       // eaten snake => lots of dots
const DOT_DROP_CUT_FACTOR = 0.70;       // cut-off half => lots of dots

/* -----------------------------
   Three.js setup
----------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0f14, 40, 220);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 18, 20);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(18, 35, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -90;
sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90;
sun.shadow.camera.bottom = -90;
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far = 140;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_SIZE * 2.2, WORLD_SIZE * 2.2),
  new THREE.MeshStandardMaterial({ color: 0x0d1726, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Border ring
const border = new THREE.Mesh(
  new THREE.RingGeometry(WORLD_SIZE * 1.01, WORLD_SIZE * 1.02, 128),
  new THREE.MeshBasicMaterial({ color: 0x1c2a3a, transparent: true, opacity: 0.6 })
);
border.rotation.x = -Math.PI / 2;
scene.add(border);

/* -----------------------------
   Mouse -> world point on y=0 plane
----------------------------- */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2(0, 0);
const planeY0 = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const mouseWorld = new THREE.Vector3(0, 0, 0);

window.addEventListener("mousemove", (e) => {
  mouseNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouseNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

function updateMouseWorld() {
  raycaster.setFromCamera(mouseNDC, camera);
  raycaster.ray.intersectPlane(planeY0, mouseWorld);
}

/* -----------------------------
   Helpers
----------------------------- */
const statsEl = document.getElementById("stats");
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function rand(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }

function inBoundsXZ(v) {
  v.x = clamp(v.x, -WORLD_SIZE, WORLD_SIZE);
  v.z = clamp(v.z, -WORLD_SIZE, WORLD_SIZE);
  v.y = 0;
  return v;
}

function dist2XZ(a, b) {
  const dx = a.x - b.x;
  const dz = a.z - b.z;
  return dx*dx + dz*dz;
}

function globalSpeedMult(elapsedSec) {
  return 1 + Math.min(RAMP_MAX, (elapsedSec / RAMP_SECS) * RAMP_MAX);
}

/* -----------------------------
   Food as InstancedMesh
----------------------------- */
const foodGeo = new THREE.SphereGeometry(0.18, 12, 10);
const foodMat = new THREE.MeshStandardMaterial({
  color: 0x36d83a, roughness: 0.45, metalness: 0.05,
  emissive: 0x0b2a0c, emissiveIntensity: 0.7
});
const foodMesh = new THREE.InstancedMesh(foodGeo, foodMat, FOOD_COUNT);
scene.add(foodMesh);

const foodPos = Array.from({ length: FOOD_COUNT }, () => new THREE.Vector3());
const tmpMat4 = new THREE.Matrix4();

function respawnFood(i, near=null) {
  if (near) {
    foodPos[i].set(
      clamp(near.x + rand(-2.6, 2.6), -WORLD_SIZE, WORLD_SIZE),
      0.18,
      clamp(near.z + rand(-2.6, 2.6), -WORLD_SIZE, WORLD_SIZE)
    );
  } else {
    foodPos[i].set(rand(-WORLD_SIZE, WORLD_SIZE), 0.18, rand(-WORLD_SIZE, WORLD_SIZE));
  }
}

for (let i = 0; i < FOOD_COUNT; i++) respawnFood(i);

function syncFoodInstances() {
  for (let i = 0; i < FOOD_COUNT; i++) {
    const p = foodPos[i];
    tmpMat4.makeTranslation(p.x, p.y, p.z);
    foodMesh.setMatrixAt(i, tmpMat4);
  }
  foodMesh.instanceMatrix.needsUpdate = true;
}
syncFoodInstances();

/* -----------------------------
   Snake class (InstancedMesh per snake)
----------------------------- */
const segGeo = new THREE.SphereGeometry(SEG_RADIUS, 14, 12);
const tmpPos = new THREE.Vector3();
const tmpQuat = new THREE.Quaternion();
const tmpScale = new THREE.Vector3();

class Snake {
  constructor({ isPlayer, color, baseSpeed, startPos, startLen }) {
    this.isPlayer = isPlayer;
    this.baseSpeed = baseSpeed;
    this.color = color;
    this.alive = true;

    this.head = startPos.clone();
    this.vel = new THREE.Vector3(0, 0, 0);

    this.segments = [];
    const L = clamp(startLen, 1, MAX_LEN);
    for (let i = 0; i < L; i++) {
      this.segments.push(startPos.clone().add(new THREE.Vector3(0, 0, i * SEG_SPACING)));
    }

    // AI steering
    this.wander = rand(0, Math.PI * 2);
    this.aiTarget = startPos.clone();
    this.aiRetargetTimer = 0;

    // visuals
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(color),
      roughness: 0.38,
      metalness: 0.08
    });
    this.mesh = new THREE.InstancedMesh(segGeo, mat, MAX_LEN);
    this.mesh.castShadow = true;
    scene.add(this.mesh);

    this._syncMesh(true);
  }

  length() { return this.segments.length; }

  grow(n) {
    const add = Math.max(0, Math.floor(n));
    for (let k = 0; k < add; k++) {
      if (this.segments.length >= MAX_LEN) break;
      const tail = this.segments[this.segments.length - 1];
      this.segments.push(tail.clone());
    }
  }

  currentSpeed(elapsedSec) {
    // FIX #1: ramp is now strong enough to notice and we display it
    return this.baseSpeed * globalSpeedMult(elapsedSec);
  }

  update(dt, elapsedSec) {
    if (!this.alive) return;

    const spd = this.currentSpeed(elapsedSec);

    let dir = new THREE.Vector3(0, 0, 0);

    if (this.isPlayer) {
      updateMouseWorld();
      dir.copy(mouseWorld).sub(this.head);
      dir.y = 0;
      if (dir.lengthSq() > 1e-6) dir.normalize();
    } else {
      this.aiRetargetTimer -= dt;
      if (this.aiRetargetTimer <= 0) {
        this.aiRetargetTimer = rand(0.45, 1.05);
        this.wander += rand(-0.9, 0.9);

        // sample some foods to chase
        let best = null;
        let bestD = Infinity;
        for (let s = 0; s < 18; s++) {
          const idx = randInt(0, FOOD_COUNT - 1);
          const p = foodPos[idx];
          const d = dist2XZ(this.head, p);
          if (d < bestD) { bestD = d; best = p; }
        }
        if (best) this.aiTarget.copy(best);
        else this.aiTarget.set(rand(-WORLD_SIZE, WORLD_SIZE), 0, rand(-WORLD_SIZE, WORLD_SIZE));
      }

      const wdir = new THREE.Vector3(Math.cos(this.wander), 0, Math.sin(this.wander)).normalize();
      const tdir = this.aiTarget.clone().sub(this.head); tdir.y = 0;
      if (tdir.lengthSq() > 1e-6) tdir.normalize();

      dir.copy(tdir).multiplyScalar(0.72).add(wdir.multiplyScalar(0.28));
      if (dir.lengthSq() > 1e-6) dir.normalize();
    }

    // velocity smoothing
    const targetVel = dir.multiplyScalar(spd);
    this.vel.lerp(targetVel, 0.14);
    this.head.addScaledVector(this.vel, dt);
    inBoundsXZ(this.head);

    // follow chain
    this.segments[0].copy(this.head);

    for (let i = 1; i < this.segments.length; i++) {
      const prev = this.segments[i - 1];
      const cur = this.segments[i];

      tmpPos.copy(cur).sub(prev);
      tmpPos.y = 0;
      const d = tmpPos.length();
      if (d < 1e-6) continue;

      const pull = (d - SEG_SPACING) / d;
      cur.addScaledVector(tmpPos, -pull);
      cur.y = 0;
    }

    this._syncMesh(false);
  }

  _syncMesh(force) {
    const L = this.segments.length;

    for (let i = 0; i < L; i++) {
      const p = this.segments[i];
      const t = i / Math.max(1, L - 1);
      const s = 1.0 - t * 0.18;

      tmpPos.set(p.x, SEG_RADIUS, p.z);
      tmpScale.set(s, s, s);
      tmpMat4.compose(tmpPos, tmpQuat, tmpScale);
      this.mesh.setMatrixAt(i, tmpMat4);
    }

    // hide unused
    for (let i = L; i < MAX_LEN; i++) {
      tmpMat4.compose(new THREE.Vector3(0, -9999, 0), tmpQuat, new THREE.Vector3(0.0001, 0.0001, 0.0001));
      this.mesh.setMatrixAt(i, tmpMat4);
    }

    this.mesh.instanceMatrix.needsUpdate = true;
    if (force) this.mesh.computeBoundingSphere();
  }

  destroy() {
    this.alive = false;
    scene.remove(this.mesh);
    this.mesh.geometry.dispose();
    this.mesh.material.dispose();
  }
}

/* -----------------------------
   Game state
----------------------------- */
let elapsed = 0;
let dead = false;

const snakes = [];
const player = new Snake({
  isPlayer: true,
  color: 0x22d3ee,
  baseSpeed: BASE_SPEED_PLAYER,
  startPos: new THREE.Vector3(0, 0, 0),
  startLen: 1
});
snakes.push(player);

function desiredAI(elapsedSec) {
  const add = Math.floor((elapsedSec / 60) * AI_GROWTH_PER_MIN);
  return clamp(AI_BASE + add, AI_BASE, AI_MAX);
}

function spawnAI() {
  const hunter = Math.random() < HUNTER_CHANCE;

  const len = hunter ? randInt(HUNTER_MIN_LEN, HUNTER_MAX_LEN) : randInt(6, 18);
  const spd = (hunter ? BASE_SPEED_AI * HUNTER_SPEED_BOOST : BASE_SPEED_AI);

  const s = new Snake({
    isPlayer: false,
    color: new THREE.Color().setHSL(Math.random(), 0.75, hunter ? 0.62 : 0.55).getHex(),
    baseSpeed: spd,
    startPos: new THREE.Vector3(rand(-WORLD_SIZE, WORLD_SIZE), 0, rand(-WORLD_SIZE, WORLD_SIZE)),
    startLen: len
  });
  snakes.push(s);
  return s;
}

for (let i = 0; i < AI_BASE; i++) spawnAI();

/* -----------------------------
   Food eating
----------------------------- */
function eatFoodForSnake(s) {
  if (!s.alive) return;

  for (let i = 0; i < FOOD_COUNT; i++) {
    const p = foodPos[i];
    if (dist2XZ(s.head, p) < (0.75 * 0.75)) {
      // respawn elsewhere (or near the snake for “trail” feel sometimes)
      respawnFood(i);
      s.grow(s.isPlayer ? GROW_PLAYER : GROW_AI);
    }
  }
}

/* -----------------------------
   Turning snake bodies into dots
----------------------------- */
function dropDotsFromSegments(segments, factor, near=null) {
  // Convert part/all of a snake body into dots by respawning random food instances near those positions.
  if (!segments || segments.length === 0) return;
  const n = clamp(Math.floor(segments.length * factor), 6, 160);

  for (let k = 0; k < n; k++) {
    const idx = randInt(0, FOOD_COUNT - 1);
    const p = segments[randInt(0, segments.length - 1)];
    respawnFood(idx, p);
  }
}

/* -----------------------------
   Combat (parallel) – FIX #2 and #3
----------------------------- */
function gameOver() {
  if (dead) return;
  dead = true;
  setTimeout(() => { alert("Game Over!"); location.reload(); }, 60);
}

function killSnake(s, dropDots=true, dotFactor=DOT_DROP_EAT_FACTOR) {
  if (!s.alive) return;
  if (s === player) { gameOver(); return; }
  if (dropDots) dropDotsFromSegments(s.segments, dotFactor);
  s.destroy();
}

function keepHalfSnakeAndDots(target, hitIndex) {
  // Mid-body cut: keep HEAD half as a snake, convert the cut-off tail to dots.
  // (This matches your “half-snake + dots” requirement.)
  const segs = target.segments;
  const headHalf = segs.slice(0, hitIndex);           // 0..hitIndex-1
  const tailHalf = segs.slice(hitIndex + 1);          // hitIndex+1..end

  // Turn cut-off half into dots
  dropDotsFromSegments(tailHalf, DOT_DROP_CUT_FACTOR);

  // Replace target’s segments with headHalf (if too small, it dies and becomes dots)
  if (headHalf.length < 10) {
    killSnake(target, true, DOT_DROP_CUT_FACTOR);
    return;
  }

  // Keep it alive with shorter body
  target.segments = headHalf.map(v => v.clone());
  target.head.copy(target.segments[0]);
  target._syncMesh(true);
}

function resolveAllCombat() {
  const live = snakes.filter(s => s.alive);

  for (let a = 0; a < live.length; a++) {
    const attacker = live[a];
    if (!attacker.alive) continue;

    for (let t = 0; t < live.length; t++) {
      if (a === t) continue;
      const target = live[t];
      if (!target.alive) continue;

      // quick reject
      if (dist2XZ(attacker.head, target.head) > (16 * 16)) continue;

      const targetLen = target.length();
      if (targetLen < 2) continue;

      // find hit index: attacker head vs target body (skip head index 0)
      let hitIndex = -1;
      const step = targetLen > 160 ? 2 : 1;
      for (let i = 1; i < targetLen; i += step) {
        if (dist2XZ(attacker.head, target.segments[i]) < HEAD_BODY_R2) {
          hitIndex = i;
          break;
        }
      }
      if (hitIndex === -1) continue;

      // RULE: larger target kills attacker
      if (targetLen > attacker.length()) {
        if (attacker === player) { gameOver(); return; }
        killSnake(attacker, true, DOT_DROP_EAT_FACTOR);
        break;
      }

      // Target is smaller/equal => cut or eat
      const isMiddle = hitIndex >= MIDDLE_MARGIN && hitIndex <= (targetLen - 1 - MIDDLE_MARGIN);

      if (isMiddle) {
        // FIX #2: mid-body collision => half-snake + dots
        if (target === player) { gameOver(); return; }
        keepHalfSnakeAndDots(target, hitIndex);

        // reward: FIX #3 requested “full length”
        // You collided with its body, so you gain the cut-off half’s length (approx).
        const gained = Math.max(1, Math.floor((targetLen - hitIndex) * 1.0));
        attacker.grow(gained);
      } else {
        // fully eaten: FIX #3 “add full length”
        if (target === player) { gameOver(); return; }

        const gained = targetLen; // full length added
        killSnake(target, true, DOT_DROP_EAT_FACTOR);
        attacker.grow(gained);
      }
    }
  }
}

/* -----------------------------
   Camera follow
----------------------------- */
const camTarget = new THREE.Vector3();
function updateCamera(dt) {
  camTarget.copy(player.head);
  const desiredPos = new THREE.Vector3(camTarget.x, 18, camTarget.z + 20);
  camera.position.lerp(desiredPos, 1 - Math.pow(0.0002, dt));
  camera.lookAt(camTarget.x, 0, camTarget.z);
}

/* -----------------------------
   Main loop
----------------------------- */
let last = performance.now();

function tick(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  elapsed += dt;

  if (!dead) {
    // spawn more AI over time (jeopardy)
    const wantAI = desiredAI(elapsed);
    const haveAI = snakes.filter(s => s.alive && !s.isPlayer).length;
    if (haveAI < wantAI) spawnAI();

    // update snakes
    for (const s of snakes) if (s.alive) s.update(dt, elapsed);

    // eat food
    for (const s of snakes) if (s.alive) eatFoodForSnake(s);

    // combat
    resolveAllCombat();

    // sync food
    syncFoodInstances();

    // camera + hud
    updateCamera(dt);
    const rampPct = Math.round((globalSpeedMult(elapsed) - 1) * 100);
    const aiLive = snakes.filter(s => s.alive && !s.isPlayer).length;
    statsEl.innerHTML =
      `<b>Length:</b> ${player.length()} &nbsp; <b>Speed:</b> ${player.currentSpeed(elapsed).toFixed(2)} ` +
      `&nbsp; <b>Ramp:</b> +${rampPct}% &nbsp; <b>AI:</b> ${aiLive}/${wantAI}`;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* -----------------------------
   Resize
----------------------------- */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
